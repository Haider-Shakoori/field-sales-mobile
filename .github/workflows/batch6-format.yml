name: batch6-format

on:
  push:
    branches:
      - batch6-offline-first-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch6-offline-first-foundation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Format Dart
        run: dart format lib test

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style(batch6): format Dart sources"
          git push origin HEAD:batch6-offline-first-foundation
