name: batch12-autoformat

on:
  push:
    branches:
      - batch12-offline-sync-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch12-offline-sync-hardening
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Batch 12: apply canonical Dart formatting"
          git push origin HEAD:batch12-offline-sync-hardening
