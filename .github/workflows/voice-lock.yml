name: voice-lock-generator

on:
  push:
    branches:
      - feat/visit-voice-notes

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Emit lockfile
        shell: bash
        run: |
          echo FIELDPULSE_LOCK_BEGIN
          base64 -w 0 pubspec.lock
          echo
          echo FIELDPULSE_LOCK_END
