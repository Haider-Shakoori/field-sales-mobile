name: refresh-push-lockfile
on:
  push:
    branches: [batch28-fcm-background-push]
permissions:
  contents: write
jobs:
  lock:
    if: "!contains(github.event.head_commit.message, 'Refresh Firebase lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch28-fcm-background-push
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Firebase lockfile"
          git push origin HEAD:batch28-fcm-background-push
