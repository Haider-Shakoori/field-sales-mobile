name: android-production-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Validate release configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIELD_SALES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIELD_SALES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIELD_SALES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          test -n "${FIELD_SALES_KEYSTORE_PASSWORD}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret."; exit 1; }
          test -n "${FIELD_SALES_KEY_ALIAS}" || { echo "Missing ANDROID_KEY_ALIAS secret."; exit 1; }
          test -n "${FIELD_SALES_KEY_PASSWORD}" || { echo "Missing ANDROID_KEY_PASSWORD secret."; exit 1; }
          test -n "${PRODUCTION_API_BASE_URL}" || { echo "Missing PRODUCTION_API_BASE_URL repository variable."; exit 1; }
          case "${PRODUCTION_API_BASE_URL}" in
            https://*/api/v1|https://*/api/v1/) ;;
            *) echo "PRODUCTION_API_BASE_URL must be HTTPS and end with /api/v1."; exit 1 ;;
          esac

      - name: Restore Android upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/field-sales-upload.jks
          chmod 600 android/field-sales-upload.jks

      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Build production AAB and APK
        shell: bash
        env:
          FIELD_SALES_KEYSTORE_FILE: ${{ github.workspace }}/android/field-sales-upload.jks
          FIELD_SALES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIELD_SALES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIELD_SALES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"

          test -n "${VERSION_NAME}" && test -n "${VERSION_CODE}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} must match pubspec version v${VERSION_NAME}."
            exit 1
          fi

          flutter build appbundle --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            --dart-define=API_BASE_URL="${PRODUCTION_API_BASE_URL}" \
            --dart-define=APP_VERSION="${VERSION_NAME}"

          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            --dart-define=API_BASE_URL="${PRODUCTION_API_BASE_URL}" \
            --dart-define=APP_VERSION="${VERSION_NAME}"

      - name: Verify signatures and generate checksums
        shell: bash
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}" || { echo "Android apksigner was not found."; exit 1; }
          "${APKSIGNER}" verify --verbose build/app/outputs/flutter-apk/app-release.apk

          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/
          (
            cd release-artifacts
            sha256sum app-release.aab app-release.apk > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: field-sales-android-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
