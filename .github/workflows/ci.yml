name: mobile-ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Verify Dart formatting
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8001/api/v1

      - name: Create ephemeral CI release keystore
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/ci-release.jks \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=FieldPulse CI, OU=CI, O=WeSoft, L=CI, ST=CI, C=AF"

      - name: Build signed release AAB
        shell: bash
        env:
          FIELD_SALES_KEYSTORE_FILE: ${{ github.workspace }}/android/ci-release.jks
          FIELD_SALES_KEYSTORE_PASSWORD: ci-release-password
          FIELD_SALES_KEY_ALIAS: ci-release
          FIELD_SALES_KEY_PASSWORD: ci-release-password
        run: |
          APP_VERSION="$(awk '/^version:/ {split($2, v, "+"); print v[1]}' pubspec.yaml)"
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://release-ci.invalid/api/v1 \
            --dart-define=APP_VERSION="${APP_VERSION}"

      - name: Verify release artifact
        shell: bash
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab

      - name: Build FieldPulse production APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          FIELD_SALES_KEYSTORE_FILE: ${{ github.workspace }}/android/ci-release.jks
          FIELD_SALES_KEYSTORE_PASSWORD: ci-release-password
          FIELD_SALES_KEY_ALIAS: ci-release
          FIELD_SALES_KEY_PASSWORD: ci-release-password
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          APP_VERSION_NAME="${APP_VERSION%%+*}"
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://fieldpulse.businessos.af/api/v1 \
            --dart-define=APP_VERSION="${APP_VERSION_NAME}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/FieldPulse-${APP_VERSION_NAME}-uat.apk"
          sha256sum "dist/FieldPulse-${APP_VERSION_NAME}-uat.apk" | tee dist/SHA256SUMS.txt

      - name: Upload FieldPulse production APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-android-uat-${{ github.run_number }}
          path: |
            dist/FieldPulse-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
