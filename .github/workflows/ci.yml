name: mobile-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.0', channel: stable, cache: true}
      - run: flutter pub get
      - name: Format Batch 10 diff
        shell: bash
        run: |
          dart format lib test
          echo "=== DART FORMAT GENERATED DIFF ==="
          git diff -- lib test
          if ! git diff --quiet -- lib test; then
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8001/api/v1
