name: mobile-ci
# CI artifacts use a newly generated testing key on every run; they are not distributable production releases.

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Validate translation CSV
        shell: bash
        run: python3 tool/import_translations.py translations/fieldpulse_mobile_translation_template.csv --validate-only

      - name: Publish translation template
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-translation-template
          path: translations/fieldpulse_mobile_translation_template.csv
          if-no-files-found: error
          retention-days: 30

      - name: Verify Dart formatting
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Compile Android debug APK
        shell: bash
        run: flutter build apk --debug

      - name: Create release keystore
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/field-sales-upload.jks \
            -storepass fieldpulse-release \
            -keypass fieldpulse-release \
            -alias fieldpulse-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FieldPulse, OU=Mobile, O=BusinessOS, L=Kabul, ST=Kabul, C=AF"

      - name: Build CI-only Android UAT APK with ephemeral signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          FIELD_SALES_KEYSTORE_FILE: ${{ github.workspace }}/android/field-sales-upload.jks
          FIELD_SALES_KEYSTORE_PASSWORD: fieldpulse-release
          FIELD_SALES_KEY_ALIAS: fieldpulse-release
          FIELD_SALES_KEY_PASSWORD: fieldpulse-release
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          APP_VERSION_NAME="${APP_VERSION%%+*}"
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://fieldpulse.businessos.af/api/v1 \
            --dart-define=APP_VERSION="${APP_VERSION_NAME}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/FieldPulse-${APP_VERSION_NAME}-uat.apk"
          sha256sum "dist/FieldPulse-${APP_VERSION_NAME}-uat.apk" | tee dist/SHA256SUMS.txt

      - name: Upload CI-only Android UAT APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-android-uat-${{ github.run_number }}
          path: |
            dist/FieldPulse-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

