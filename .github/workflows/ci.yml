name: mobile-ci

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1

      - name: Bootstrap generated pubspec.lock on Batch 18 branch
        if: github.event_name == 'push' && github.ref_name == 'stage2-batch18-android-release-engineering'
        shell: bash
        run: |
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1 && git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is already committed and unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "Stage 2 Batch 18: pin Flutter dependencies"
          git push origin HEAD:stage2-batch18-android-release-engineering
      - name: Verify Dart formatting
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8001/api/v1

      - name: Create ephemeral CI release keystore
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/ci-release.jks \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Field Sales CI, OU=CI, O=WeSoft, L=CI, ST=CI, C=AF"

      - name: Build signed release AAB
        shell: bash
        env:
          FIELD_SALES_KEYSTORE_FILE: ${{ github.workspace }}/android/ci-release.jks
          FIELD_SALES_KEYSTORE_PASSWORD: ci-release-password
          FIELD_SALES_KEY_ALIAS: ci-release
          FIELD_SALES_KEY_PASSWORD: ci-release-password
        run: |
          APP_VERSION="$(awk '/^version:/ {split($2, v, "+"); print v[1]}' pubspec.yaml)"
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://release-ci.invalid/api/v1 \
            --dart-define=APP_VERSION="${APP_VERSION}"

      - name: Verify release artifact
        shell: bash
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab
