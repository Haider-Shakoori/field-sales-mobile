name: mobile-ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Verify Dart formatting
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Create release keystore
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/field-sales-upload.jks \
            -storepass fieldpulse-release \
            -keypass fieldpulse-release \
            -alias fieldpulse-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FieldPulse, OU=Mobile, O=BusinessOS, L=Kabul, ST=Kabul, C=AF"

      - name: Build FieldPulse production APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          FIELD_SALES_KEYSTORE_FILE: ${{ github.workspace }}/android/field-sales-upload.jks
          FIELD_SALES_KEYSTORE_PASSWORD: fieldpulse-release
          FIELD_SALES_KEY_ALIAS: fieldpulse-release
          FIELD_SALES_KEY_PASSWORD: fieldpulse-release
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          APP_VERSION_NAME="${APP_VERSION%%+*}"
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://fieldpulse.businessos.af/api/v1 \
            --dart-define=APP_VERSION="${APP_VERSION_NAME}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/FieldPulse-${APP_VERSION_NAME}-uat.apk"
          sha256sum "dist/FieldPulse-${APP_VERSION_NAME}-uat.apk" | tee dist/SHA256SUMS.txt

      - name: Upload FieldPulse production APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-android-uat-${{ github.run_number }}
          path: |
            dist/FieldPulse-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  production-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore production Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/field-sales-upload.jks
          chmod 600 android/field-sales-upload.jks
      - name: Build production APK
        shell: bash
        env:
          FIELD_SALES_KEYSTORE_FILE: ${{ github.workspace }}/android/field-sales-upload.jks
          FIELD_SALES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIELD_SALES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIELD_SALES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          APP_VERSION_NAME="${APP_VERSION%%+*}"
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://fieldpulse.businessos.af/api/v1 \
            --dart-define=APP_VERSION="${APP_VERSION_NAME}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FieldPulse-Android.apk
          sha256sum dist/FieldPulse-Android.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-production-apk-${{ github.run_number }}
          path: |
            dist/FieldPulse-Android.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
