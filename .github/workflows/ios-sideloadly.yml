name: Build FieldPulse iOS IPA for Sideloadly

on:
  push:
    branches:
      - build/ios-sideloadly-20261003
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldpulse-ios-sideloadly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout latest FieldPulse mobile
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate iOS platform
        shell: bash
        run: |
          if [ ! -d ios ]; then
            BOOTSTRAP_DIR="$(mktemp -d)"
            flutter create \
              --platforms=ios \
              --org com.businessos \
              --project-name field_sales_mobile \
              "$BOOTSTRAP_DIR"

            cp -R "$BOOTSTRAP_DIR/ios" ./ios
            rm -rf "$BOOTSTRAP_DIR"
          fi

          python3 - <<'PY'
          from pathlib import Path

          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = pbx.read_text()
          s = s.replace("com.businessos.fieldSalesMobile", "com.businessos.fieldpulse")
          s = s.replace("com.businessos.field_sales_mobile", "com.businessos.fieldpulse")
          pbx.write_text(s)
          PY

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FieldPulse" ios/Runner/Info.plist || true

          add_plist_string() {
            local key="$1"
            local value="$2"
            /usr/libexec/PlistBuddy -c "Set :$key $value" ios/Runner/Info.plist 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :$key string '$value'" ios/Runner/Info.plist
          }

          add_plist_string NSLocationWhenInUseUsageDescription "FieldPulse uses your location for attendance, visits, routes and field activity."
          add_plist_string NSLocationAlwaysAndWhenInUseUsageDescription "FieldPulse uses background location during active field work and attendance sessions."
          add_plist_string NSLocationAlwaysUsageDescription "FieldPulse uses background location during active field work and attendance sessions."
          add_plist_string NSCameraUsageDescription "FieldPulse uses the camera to capture visit and work evidence."
          add_plist_string NSPhotoLibraryUsageDescription "FieldPulse accesses selected photos for visit and work evidence."
          add_plist_string NSMicrophoneUsageDescription "FieldPulse may use the microphone when capturing supported media."

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string remote-notification" ios/Runner/Info.plist

          if [ -f ios/Podfile ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Podfile")
          s = p.read_text()
          if "# platform :ios" in s:
              s = s.replace("# platform :ios, '13.0'", "platform :ios, '13.0'")
          elif "platform :ios" not in s:
              s = "platform :ios, '13.0'\n" + s
          p.write_text(s)
          PY
          fi

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test --concurrency=1

      - name: Build unsigned release app
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"

          flutter build ios \
            --release \
            --no-codesign \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            --dart-define=API_BASE_URL=https://fieldpulse.businessos.af/api/v1 \
            --dart-define=APP_VERSION="${VERSION_NAME}" \
            --dart-define=TILE_URL_TEMPLATE=https://maps.fieldpulse.businessos.af/styles/afghanistan/{z}/{x}/{y}.png

      - name: Package unsigned IPA
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (
            cd dist
            zip -qry FieldPulse-1.0.2-main-4d03b3d-unsigned.ipa Payload
            rm -rf Payload
            shasum -a 256 FieldPulse-1.0.2-main-4d03b3d-unsigned.ipa > SHA256SUMS.txt
          )

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldPulse-iOS-Sideloadly-main-4d03b3d
          path: |
            dist/FieldPulse-1.0.2-main-4d03b3d-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
