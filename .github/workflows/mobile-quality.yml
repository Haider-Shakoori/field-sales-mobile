name: mobile-quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/mobile-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        shell: bash
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            echo "::group::Formatting diff"
            git diff -- lib test
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload formatter output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-ui-sources
          path: |
            lib/ui/login_screen.dart
            lib/ui/more_screen.dart
            lib/ui/orders_screen.dart
            lib/ui/widgets/fieldpulse_ui.dart
          if-no-files-found: error
          retention-days: 1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --concurrency=1
