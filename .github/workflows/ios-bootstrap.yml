name: iOS bootstrap and compile

on:
  push:
    branches:
      - feat/ios-adhoc-github
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate iOS project when missing
        id: bootstrap
        shell: bash
        run: |
          if [ -d ios ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BOOTSTRAP_DIR="$(mktemp -d)"
          flutter create             --platforms=ios             --org com.businessos             --project-name field_sales_mobile             "$BOOTSTRAP_DIR"

          cp -R "$BOOTSTRAP_DIR/ios" ./ios
          rm -rf "$BOOTSTRAP_DIR"

          # Flutter may rewrite analysis_options.yaml while resolving the temporary
          # project. Restore all tracked non-iOS files before continuing.
          git checkout -- analysis_options.yaml

          python3 - <<'PY'
          from pathlib import Path

          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          lines = pbx.read_text().splitlines()
          out = []
          for line in lines:
              if "PRODUCT_BUNDLE_IDENTIFIER =" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  if "RunnerTests" in line:
                      line = f"{indent}PRODUCT_BUNDLE_IDENTIFIER = com.businessos.fieldpulse.RunnerTests;"
                  else:
                      line = f"{indent}PRODUCT_BUNDLE_IDENTIFIER = com.businessos.fieldpulse;"
              out.append(line)
          pbx.write_text("\n".join(out) + "\n")
          PY

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FieldPulse" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'FieldPulse uses your location for attendance, visits, routes and field activity.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'FieldPulse uses background location during active field work and attendance sessions.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'FieldPulse uses the camera to capture visit and work evidence.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'FieldPulse accesses selected photos for visit and work evidence.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'FieldPulse may use the microphone when capturing supported media.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string remote-notification" ios/Runner/Info.plist

          if [ -f ios/Podfile ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Podfile")
          s = p.read_text()
          if "# platform :ios" in s:
              s = s.replace("# platform :ios, '13.0'", "platform :ios, '13.0'")
          elif "platform :ios" not in s:
              s = "platform :ios, '13.0'\n" + s
          p.write_text(s)
          PY
          fi

          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Ensure bootstrap touched only iOS
        if: steps.bootstrap.outputs.generated == 'true'
        shell: bash
        run: |
          NON_IOS="$(git status --porcelain | awk '{print $2}' | grep -v '^ios/' || true)"
          if [ -n "$NON_IOS" ]; then
            echo "Bootstrap unexpectedly changed non-iOS paths:"
            echo "$NON_IOS"
            exit 1
          fi

      - name: Commit generated iOS platform
        if: steps.bootstrap.outputs.generated == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git commit -m "feat(ios): bootstrap FieldPulse iOS platform"
          git push origin HEAD:feat/ios-adhoc-github

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=1

      - name: Build unsigned iOS release
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"

          flutter build ios --release --no-codesign             --build-name="${VERSION_NAME}"             --build-number="${VERSION_CODE}"             --dart-define=API_BASE_URL=https://fieldpulse.businessos.af/api/v1             --dart-define=APP_VERSION="${VERSION_NAME}"             --dart-define=TILE_URL_TEMPLATE=https://maps.fieldpulse.businessos.af/styles/afghanistan/{z}/{x}/{y}.png

      - name: Package unsigned IPA artifact
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (
            cd dist
            zip -qry FieldPulse-iOS-unsigned.ipa Payload
            rm -rf Payload
            shasum -a 256 FieldPulse-iOS-unsigned.ipa > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-ios-unsigned-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
