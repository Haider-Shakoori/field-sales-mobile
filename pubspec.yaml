name: field_sales_mobile
description: Offline-first Android client for FieldPulse.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.1.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  image_picker: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/branding/fieldpulse_splash.webp
